<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Terminkalender</h1>

      <div class="toolbar">
        <input type="date" id="dateInput" />
        <input type="text" id="textInput" placeholder="Termin beschreiben" />
        <button id="addBtn">Hinzufügen</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Datum</th>
            <th>Beschreibung</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody id="eventTableBody"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
